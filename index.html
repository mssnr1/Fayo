<!doctype html>
<html lang="de" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1120" />
    <title>Fayo · Gesichtsübungen</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage"></div>

    <header class="top">
      <span class="brand">Fayo</span>
      <button id="theme" class="ghost" aria-label="Tag oder Nacht">☾</button>
    </header>

    <div id="coach" aria-live="polite">
      <h2 id="step"></h2>
      <p id="cue"></p>
    </div>

    <section id="overview" class="page">
      <div class="list">
        <p class="eyebrow">Übungen</p>
        <h1>Was trainierst du heute?</h1>
        <div id="cards" class="cards"></div>
      </div>
    </section>

    <section id="start" class="screen hidden">
      <div class="sheet">
        <button id="back" class="back" aria-label="Zur Übersicht">‹ Übungen</button>
        <p class="eyebrow" id="ex-minutes"></p>
        <h1 id="ex-title"></h1>
        <p class="lead" id="ex-lead"></p>
        <button id="go" class="solid" disabled>Lädt …</button>
        <p class="fine" id="ex-fine"></p>
      </div>
    </section>

    <section id="run" class="screen hidden" aria-live="polite">
      <div class="guide">
        <div class="meta"><span id="rep"></span><span id="count"></span></div>
        <div class="bar"><i id="progress"></i></div>
        <div class="row">
          <button id="pause" class="ghost-pill">Pause</button>
          <button id="stop" class="ghost-pill">Beenden</button>
        </div>
      </div>
    </section>

    <section id="done" class="screen hidden">
      <div class="sheet">
        <p class="eyebrow">Geschafft</p>
        <h1>Gut gemacht.</h1>
        <p class="lead">Spür kurz nach, wie sich die Partie anfühlt. Täglich ein Durchgang pro Übung reicht für den Anfang.</p>
        <button id="again" class="solid">Nochmal</button>
        <button id="home" class="link">Andere Übung</button>
      </div>
    </section>

    <footer class="credit">Anatomie nach Z-Anatomy (CC BY-SA 4.0) und BodyParts3D (CC BY-SA 2.1 JP). Prototyp, keine medizinische Beratung.</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
